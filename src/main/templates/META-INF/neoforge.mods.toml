# This is an example neoforge.mods.toml file. It contains the data relating to the loading mods.
# There are several mandatory fields (#mandatory), and many more that are optional (#optional).
# The overall format is standard TOML format, v0.5.0.
# Note that there are a couple of TOML lists in this file.
# Find more information on toml format here:  https://github.com/toml-lang/toml

# The name of the mod loader type to load - for regular FML @Mod mods it should be javafml
modLoader="javafml" #mandatory

# A version range to match for said mod loader - for regular FML @Mod it will be the FML version. This is currently 2.
loaderVersion="${loader_version_range}" #mandatory

# The license for you mod. This is mandatory metadata and allows for easier comprehension of your redistributive properties.
# Review your options at https://choosealicense.com/. All rights reserved is the default copyright stance, and is thus the default here.
license="${mod_license}"

# A URL to refer people to when problems occur with this mod
issueTrackerURL="https://discord.gg/DqzTE3Ux8" #optional

# A list of mods - how many allowed here is determined by the individual mod loader
[[mods]] #mandatory

# The modid of the mod
modId="${mod_id}" #mandatory

# The version number of the mod
version="${mod_version}" #mandatory

# A display name for the mod
displayName="${mod_name}" #mandatory

# A URL to query for updates for this mod. See the JSON update specification https://docs.neoforged.net/docs/misc/updatechecker/
#updateJSONURL="https://change.me.example.invalid/updates.json" #optional

# A URL for the "homepage" for this mod, displayed in the mod UI
displayURL="https://discord.gg/DqzTE3Ux8" #optional

# A file name (in the root of the mod JAR) containing a logo for display
logoFile="logo.png" #optional

# A text field displayed in the mod UI
credits="Created by LanderAlo. Genshin Nature models & creature assets originally created by fapdos & team, used with direct permission. Inspired by Solo Leveling, Omniscient Reader's Viewpoint, and classic Murim manhwa fantasy." #optional

# The authors of the mod, displayed in the mod UI (optional)
authors="LanderAlo"

# The description text for the mod (multi line!) (#mandatory)
description='''
Awakening System is an RPG progression, dungeon and combat mod inspired by Solo Leveling, Omniscient Reader's Viewpoint, Murim manhwa and Genshin Impact.

Key Features:
- The System: it wakes at the Altar of Origin in the Great Tower. Levels up to 2000, hunter ranks from E to S and beyond, evaluated by the Hunter Association, free stats, titles, fables, daily training and Dokkaebi scenario missions.
- Classes: six base classes that evolve into advanced ones at level 150, each with a large skill web. Tools level up by their own work.
- Two interface styles: the classic System windows (key K) and a full-dive SAO style, with HUD, health bars and menus to match.
- The Great Tower: 25 floors with their own land, towns with their own people, ores ranked by floor, a smith who forges to order, and floor bosses.
- Gates and dungeons: ranked Ruin Gates, the Forgotten Catacombs, Abyssal Grottos and the Limbo.
- Worlds: Isekai beneath the World Tree, the floating Murim sect with Qi cultivation through 14 realms, and Teyvat with its cities, bosses and the Spiral Abyss (12 floors, a reset every 14 days, records and chamber treasure).
- Shadows and companions: raise shadow soldiers into squads, Kaisel the wyvern, Paimon, celestial dragons, and Uma Musume racers with their own racetrack.
- Wishes and shop: a wish system with banners and pity, the System shop, bank, roulette and hunters' market.
- Weapons: the celestial armory, Solo Leveling weapons, 3D shields and armour, with Epic Fight and Better Combat support.
- Map: the Diorama 3D map is built in (it turns itself off if another map mod is installed).
- Languages: English, Spanish, Portuguese and Russian (German and French in progress).
'''

# The [[mixins]] block allows you to declare your mixin config to FML so that it gets loaded.
[[mixins]]
config="${mod_id}.mixins.json"

[[mixins]]
config="diorama.mixins.json"

[[mixins]]
config="bettercaves.mixins.json"

[[mods]]
modId="diorama"
version="0.2.1"
displayName="Diorama 3D Map Engine"
credits="Created by Dara Adedeji, MIT License. Integrated into Awakening System."
authors="Dara Adedeji, LanderAlo"
description="Diorama angled 3D ray-traced voxel minimap and world map engine."

[[mods]]
modId="bettercaves"
version="26.1.2"
displayName="YUNG's Better Caves"
credits="Created by YUNGNICKYOUNG, GNU LGPL v3. Integrated into Awakening System."
authors="YUNGNICKYOUNG, LanderAlo"
description="YUNG's Better Caves underground cave generation engine."

# A dependency - use the . to indicate dependency for a specific modid. Dependencies are optional.
[[dependencies.${mod_id}]] #optional
    # the modid of the dependency
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

# Here's another dependency
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="geckolib"
    type="required"
    versionRange="[4.7.4,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.bettercaves]]
    modId="neoforge"
    type="required"
    versionRange="[21.1.249,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.bettercaves]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
