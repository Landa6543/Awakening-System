# ModernFix Configuration for NeoForge 1.21.1
[perf]
	# Significantly accelerates Minecraft startup time by caching resource packs and model generators
	dynamic_resources = true
	# Enables async pathfinding enhancements and entity cache
	cache_world_generators = true
	# Cleans up memory leaks on world exit/reload
	clear_duplicate_entity_data = true
[bugfixes]
	# Fix chunk loading deadlocks in heavily modded environments
	chunk_deadlocks = true
