# Configuration for BigStacks
[general]
	# Maximum stack size for standard stackable items (default vanilla is 64).
	# Recommended for RPG / Awakening System dungeon drops: 1024
	# Range: 1 ~ 2147483647
	maxStackSize = 1024

	# Whether tools, armor, and weapons can also be stacked (false recommended for RPG balance)
	stackToolsAndArmor = false

	# Maximum stack size for potion bottles and soups
	# Range: 1 ~ 1024
	maxPotionStackSize = 16
